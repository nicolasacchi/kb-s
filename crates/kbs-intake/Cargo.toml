[package]
name = "kbs-intake"
# I binari sono dichiarati esplicitamente piu' in basso. Senza questo, cargo
# inferisce un binario `kbs-intake` da src/main.rs, che non esiste, e la build
# fallisce con «main function not found».
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Le quattro strade di intake, il model lock e il gate di pubblicazione (D10, D4)"

[dependencies]
kbs-core.workspace = true
kbs-store.workspace = true
kbs-doc.workspace = true
kbs-verify.workspace = true
rusqlite = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "kbs"
path = "src/bin/kbs.rs"
