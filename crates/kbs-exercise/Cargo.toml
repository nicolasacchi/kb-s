authors.workspace = true
description = "Esercizi parametrizzati con seed e verificatore deterministico: l'integrita' accademica per costruzione (D8)"

[dependencies]
kbs-core = { workspace = true }
# La dipendenza va in un solo verso, ed è `kbs-verify` a porre la domanda
