# qui. `kbs-verify` non conosce `kbs-exercise`, quindi il grafo resta aciclico —
# `kbs-store` dipende da `kbs-verify` e non da questo crate.
kbs-verify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
