[workspace]
resolver = "2"
members = [
    "crates/kbs-core",
    "crates/kbs-store",
    "crates/kbs-fixtures",
    "crates/kbs-doc",
    "crates/kbs-verify",
    "crates/kbs-exercise",
    "crates/kbs-intake",
    "crates/kbs-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicolasacchi/kb-s"
authors = ["Nicola <n@scc.im>"]

[workspace.dependencies]
kbs-core = { path = "crates/kbs-core" }
kbs-store = { path = "crates/kbs-store" }
kbs-fixtures = { path = "crates/kbs-fixtures" }
kbs-doc = { path = "crates/kbs-doc" }
kbs-verify = { path = "crates/kbs-verify" }
kbs-exercise = { path = "crates/kbs-exercise" }
kbs-intake = { path = "crates/kbs-intake" }
kbs-server = { path = "crates/kbs-server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions"] }
refinery = { version = "0.9", features = ["rusqlite"] }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "compression-gzip"] }
scraper = "0.23"
lol_html = "2"
sha2 = "0.10"
hex = "0.4"
ulid = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
rand = "0.9"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
